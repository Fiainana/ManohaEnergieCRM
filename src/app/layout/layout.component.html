<div class="shell">
  <aside class="sidebar">
    <div class="sidebar__brand">
      <span class="sidebar__logo">ME</span>
      <span class="sidebar__name">{{ appName }}</span>
    </div>

    <nav class="sidebar__nav">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" class="sidebar__link">
        Tableau de bord
      </a>
      <!-- Modules métier à ajouter -->
    </nav>

    <div class="sidebar__footer">
      <div class="sidebar__user">
        <span class="sidebar__avatar">{{ (auth.displayName() || '?').charAt(0) }}</span>
        <div class="sidebar__user-meta">
          <strong>{{ auth.displayName() || auth.user()?.login }}</strong>
          <small class="text-muted">{{ auth.roles().join(', ') || 'Utilisateur' }}</small>
        </div>
      </div>
      <button type="button" class="btn btn--ghost sidebar__logout" (click)="logout()">
        Déconnexion
      </button>
    </div>
  </aside>

  <div class="shell__main">
    <header class="topbar">
      <h1 class="topbar__title">Espace commercial</h1>
    </header>
    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
