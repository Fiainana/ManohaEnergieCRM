<div class="shell" [class.shell--collapsed]="collapsed()">
  <aside class="sidebar" [class.is-collapsed]="collapsed()">
    <div class="sidebar__brand">
      <span class="sidebar__logo" aria-hidden="true">ME</span>
      <span class="sidebar__name">{{ appName }}</span>
    </div>

    <nav class="sidebar__nav" aria-label="Navigation principale">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" class="sidebar__link" [title]="collapsed() ? 'Tableau de bord' : ''">
        <svg class="sidebar__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M3 13h8V3H3zm0 8h8v-6H3zm10 0h8V11h-8zm0-18v6h8V3z" />
        </svg>
        <span class="sidebar__label">Tableau de bord</span>
      </a>
      <a routerLink="/clients" routerLinkActive="is-active" class="sidebar__link" [title]="collapsed() ? 'Clients' : ''">
        <svg class="sidebar__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3m-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3m0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5C15 14.17 10.33 13 8 13m8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5" />
        </svg>
        <span class="sidebar__label">Clients</span>
      </a>
      <a routerLink="/articles" routerLinkActive="is-active" class="sidebar__link" [title]="collapsed() ? 'Articles' : ''">
        <svg class="sidebar__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M20 2H4c-1 0-2 .9-2 2v3.01c0 .72.43 1.34 1 1.69V20c0 1.1 1.1 2 2 2h14c.9 0 2-.9 2-2V8.7c.57-.35 1-.97 1-1.69V4c0-1.1-1-2-2-2m-5 12H9v-2h6zm5-7H4V4h16z" />
        </svg>
        <span class="sidebar__label">Articles</span>
      </a>
      <a routerLink="/devis" routerLinkActive="is-active" class="sidebar__link" [title]="collapsed() ? 'Devis' : ''">
        <svg class="sidebar__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8zm4 18H6V4h7v5h5z" />
        </svg>
        <span class="sidebar__label">Devis</span>
      </a>
    </nav>

    <div class="sidebar__footer">
      <div class="sidebar__user" [title]="auth.displayName() || auth.user()?.login || ''">
        <span class="sidebar__avatar">{{ (auth.displayName() || '?').charAt(0) }}</span>
        <div class="sidebar__user-meta">
          <strong>{{ auth.displayName() || auth.user()?.login }}</strong>
          <small>{{ auth.roles().join(', ') || 'Utilisateur' }}</small>
        </div>
      </div>
      <button type="button" class="sidebar__action" (click)="logout()" [title]="collapsed() ? 'Déconnexion' : ''">
        <svg class="sidebar__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4z" />
        </svg>
        <span class="sidebar__label">Déconnexion</span>
      </button>
      <p class="sidebar__powered">Powered by <strong>Aikflow</strong></p>
    </div>

    <button type="button" class="sidebar__toggle" (click)="toggleSidebar()" [attr.aria-expanded]="!collapsed()" [attr.aria-label]="collapsed() ? 'Élargir le menu' : 'Réduire le menu'" [title]="collapsed() ? 'Élargir' : 'Réduire'">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        @if (collapsed()) {
          <path fill="currentColor" d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" />
        } @else {
          <path fill="currentColor" d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
        }
      </svg>
    </button>
  </aside>

  <div class="shell__main">
    <header class="topbar">
      <button type="button" class="topbar__menu" (click)="toggleSidebar()" [attr.aria-label]="collapsed() ? 'Élargir le menu' : 'Réduire le menu'">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M3 6h18v2H3V6m0 5h18v2H3v-2m0 5h18v2H3v-2z" />
        </svg>
      </button>
      <h1 class="topbar__title">Espace commercial</h1>
    </header>
    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
